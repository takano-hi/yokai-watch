<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="outerRing" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="60%" stop-color="#f5a800"/>
      <stop offset="100%" stop-color="#c47a00"/>
    </radialGradient>
    <radialGradient id="innerBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff9e6"/>
      <stop offset="100%" stop-color="#ffe8a0"/>
    </radialGradient>
    <radialGradient id="rimShine" cx="35%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#fff5c0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c47a00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="#fff"/>

  <!-- outer gold ring -->
  <circle cx="128" cy="128" r="124" fill="url(#outerRing)"/>
  <!-- rim notches -->
  <circle cx="128" cy="128" r="124" fill="none" stroke="#c47a00" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- rim shine -->
  <circle cx="128" cy="128" r="124" fill="url(#rimShine)"/>

  <!-- tribe symbol band -->
  <circle cx="128" cy="128" r="112" fill="#d4610a"/>
  <!-- tribe pattern dots -->
  <circle cx="128" cy="16"  r="5" fill="#ffcc44"/>
  <circle cx="206" cy="50"  r="5" fill="#ffcc44"/>
  <circle cx="240" cy="128" r="5" fill="#ffcc44"/>
  <circle cx="206" cy="206" r="5" fill="#ffcc44"/>
  <circle cx="128" cy="240" r="5" fill="#ffcc44"/>
  <circle cx="50"  cy="206" r="5" fill="#ffcc44"/>
  <circle cx="16"  cy="128" r="5" fill="#ffcc44"/>
  <circle cx="50"  cy="50"  r="5" fill="#ffcc44"/>
  <!-- tribe kanji area -->
  <circle cx="128" cy="128" r="100" fill="#1a1a4e"/>

  <!-- inner face background -->
  <circle cx="128" cy="128" r="90" fill="url(#innerBg)"/>

  <!-- ===== yokai face ===== -->
  <!-- ears -->
  <ellipse cx="68" cy="128" rx="15" ry="20" fill="#ffe066"/>
  <ellipse cx="68" cy="128" rx="9" ry="13" fill="#ffb3b3"/>
  <ellipse cx="188" cy="128" rx="15" ry="20" fill="#ffe066"/>
  <ellipse cx="188" cy="128" rx="9" ry="13" fill="#ffb3b3"/>

  <!-- mini horns -->
  <polygon points="102,58 96,36 112,56" fill="#ff6b6b"/>
  <polygon points="154,58 160,36 144,56" fill="#ff6b6b"/>

  <!-- head -->
  <circle cx="128" cy="118" r="58" fill="#ffe066"/>

  <!-- eyes white -->
  <ellipse cx="110" cy="112" rx="14" ry="16" fill="white"/>
  <ellipse cx="146" cy="112" rx="14" ry="16" fill="white"/>
  <!-- pupils -->
  <circle cx="113" cy="115" r="9"  fill="#222"/>
  <circle cx="149" cy="115" r="9"  fill="#222"/>
  <!-- shine -->
  <circle cx="116" cy="111" r="3" fill="white"/>
  <circle cx="152" cy="111" r="3" fill="white"/>

  <!-- eyebrows -->
  <path d="M96 96 Q110 88 124 96" stroke="#6b4c1e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M132 96 Q146 88 160 96" stroke="#6b4c1e" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- nose -->
  <ellipse cx="128" cy="122" rx="6" ry="4" fill="#f5b800"/>

  <!-- mouth -->
  <path d="M112 136 Q128 150 144 136" stroke="#c0392b" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- cheeks -->
  <ellipse cx="88"  cy="126" rx="11" ry="7" fill="#ff9999" opacity="0.5"/>
  <ellipse cx="168" cy="126" rx="11" ry="7" fill="#ff9999" opacity="0.5"/>

  <!-- body stub -->
  <ellipse cx="128" cy="174" rx="38" ry="28" fill="#ffe066"/>
  <ellipse cx="128" cy="174" rx="24" ry="18" fill="#fff3b0"/>

  <!-- tribe letter -->
  <text x="128" y="220" text-anchor="middle" font-family="serif" font-size="16" fill="#ffcc44" font-weight="bold">妖</text>

  <!-- outer gold rim overlay -->
  <circle cx="128" cy="128" r="124" fill="none" stroke="#ffe066" stroke-width="3"/>
  <circle cx="128" cy="128" r="118" fill="none" stroke="#fff5aa" stroke-width="1.5" opacity="0.6"/>
</svg>
